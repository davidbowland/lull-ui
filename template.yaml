AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Infrastructure for Lull UI

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - test
    Description: Environment for deploy

Mappings:
  EnvironmentMap:
    prod:
      # Cross-repo coupling: these names must match the ARNs lull-infrastructure's
      # PipelineRole grants. IAM accepts a nonexistent ARN silently, so a mismatch
      # surfaces only as an AccessDenied at deploy time.
      bucketName: lull-ui
      # Existing wildcard for *.dbowland.com. CloudFront requires the certificate in
      # us-east-1, and this one already serves the sibling apps -- do not request a new
      # one.
      certificate: adce1a21-90b4-4120-8548-111215e582f0
      domain: lull.dbowland.com
      zoneId: Z072422417XWM8PIXXSFA
    test:
      bucketName: lull-ui-test
      certificate: 6a48cba7-feb9-4de5-8cbf-d383140fcdef
      domain: lull.bowland.link
      zoneId: Z01312547RGU1BYKIJXY

Resources:
  # Bucket

  UiBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: !FindInMap [EnvironmentMap, !Ref Environment, bucketName]
      Tags:
        - Key: 'created-by'
          Value: 'lull-ui'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment

  UiBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UiBucket
      PolicyDocument:
        Statement:
          - Action: 's3:Get*'
            Effect: Allow
            Resource: !Sub 'arn:aws:s3:::${UiBucket}/*'
            Principal:
              CanonicalUser: !GetAtt OriginAccessIdentity.S3CanonicalUserId

  # CDN

  OriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub
          - 'Access identity for ${Domain}'
          - Domain: !FindInMap [EnvironmentMap, !Ref Environment, domain]

  UiCloudfrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !FindInMap [EnvironmentMap, !Ref Environment, domain]
        # 403 and not just 404: the bucket is fronted by an origin access identity and
        # grants no s3:ListBucket, so S3 answers a missing key with AccessDenied. Left
        # alone, a mistyped URL renders S3's XML rather than a page.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404/index.html
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404/index.html
          - ErrorCode: 500
            ResponseCode: 500
            ResponsePagePath: /500/index.html
        DefaultCacheBehavior:
          AllowedMethods:
            - 'GET'
            - 'HEAD'
            - 'OPTIONS'
          CachePolicyId: '658327ea-f89d-4fab-a63d-7e88639e58f6' # Managed-CachingOptimized
          Compress: true
          DefaultTTL: 0
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UiUrlRewriteFunction.FunctionARN
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: 'redirect-to-https'
        DefaultRootObject: 'index.html'
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt UiBucket.RegionalDomainName
            Id: S3Origin
            S3OriginConfig:
              OriginAccessIdentity: !Sub
                - 'origin-access-identity/cloudfront/${Identity}'
                - Identity: !Ref OriginAccessIdentity
        PriceClass: 'PriceClass_100'
        ViewerCertificate:
          AcmCertificateArn: !Sub
            - 'arn:aws:acm:us-east-1:${AWS::AccountId}:certificate/${Certificate}'
            - Certificate: !FindInMap [EnvironmentMap, !Ref Environment, certificate]
          MinimumProtocolVersion: 'TLSv1.2_2018'
          SslSupportMethod: 'sni-only'
      Tags:
        - Key: 'created-by'
          Value: 'lull-ui'
        - Key: 'created-for'
          Value: 'lull'
        - Key: 'environment'
          Value: !Ref Environment

  # NOTE: public/sw.js replicates both rewrites below -- the dynamic-route rule in
  # shellFor and the trailing index.html rule in indexFor. Offline there is no
  # CloudFront, so /p/<id> would miss the service worker cache entirely without them.
  # The two are NOT written the same way and must not be made to match: the exported
  # shell lives at the literal out/p/[puzzleId]/index.html, which the edge asks for
  # unencoded and the Cache API asks for percent-encoded. Change one and you must change
  # the other.
  UiUrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;

          // Client-side route data for the dynamic puzzle route, e.g.
          // /_next/data/<buildId>/p/2026-08-18:gofigure:9f3a1c02.json -> the exported placeholder payload
          var dataMatch = uri.match(/^(\/_next\/data\/[^\/]+)\/p\/[^\/]+\.json$/);
          if (dataMatch) {
            request.uri = dataMatch[1] + '/p/__placeholder__.json';
            return request;
          }

          if (/^\/p\/[^\/]+(\/)?$/.test(uri)) {
            request.uri = '/p/[puzzleId]/index.html';
            return request;
          }

          if (uri.endsWith('/')) {
            request.uri += 'index.html';
          } else if (!/\.[^/]+$/.test(uri)) {
            request.uri += '/index.html';
          }

          return request;
        }
      FunctionConfig:
        Comment: !Sub
          - 'URL rewrite for ${Domain} - appends index.html and rewrites dynamic puzzle routes'
          - Domain: !FindInMap [EnvironmentMap, !Ref Environment, domain]
        Runtime: cloudfront-js-2.0
      Name: !Sub
        - '${Environment}-lull-ui-url-rewrite'
        - Environment: !Ref Environment

  # DNS

  DomainDns:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName: !GetAtt UiCloudfrontDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront resources HostedZoneId
      HostedZoneId: !FindInMap [EnvironmentMap, !Ref Environment, zoneId]
      Name: !FindInMap [EnvironmentMap, !Ref Environment, domain]
      Type: A
